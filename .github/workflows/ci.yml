name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The supported platforms: linux/amd64 and darwin/arm64.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race detector on shared scoring
        run: go test -race ./scoring/ ./cmd/predict/

      # Benchmarks run once at their smallest sizes, so they keep working;
      # CI never asserts timings.
      - name: Benchmarks compile and run
        run: go test -run '^$' -bench . -benchtime 1x -short ./...

      - name: Build
        run: go build ./...
